<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>다커서 운동회 스태프 업무 안내</title>
<meta name="description" content="2026 부산 사회복지사대회 스태프·자원봉사자 개인별 시간대 업무 안내">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#1b2235; --sub:#5b6478; --line:#e3e7f0;
  --brand:#1f3a8a; --brand-2:#2c52c8; --accent:#ff7a1a; --accent-soft:#fff1e6;
  --ok:#15803d; --ok-soft:#e7f6ec; --warn:#b45309; --warn-soft:#fef3c7;
  --prep:#64748b; --cere:#7c3aed; --game:#2563eb; --lunch:#ea580c; --fin:#db2777; --post:#0f766e; --award:#b7791f;
  --radius:16px; --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%;word-break:keep-all}
button{font:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}

/* header */
header.top{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);color:#fff;padding:22px 0 64px}
header.top .wrap{padding-bottom:0}
.eyebrow{font-size:13px;opacity:.85;letter-spacing:.02em}
h1{font-size:24px;line-height:1.3;margin:4px 0 6px;font-weight:800}
.meta{font-size:13px;opacity:.9}
.meta span{display:inline-block;margin-right:10px}

/* search card */
.search-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-top:-48px;position:relative}
.search-card label{font-weight:700;font-size:15px;display:block;margin-bottom:8px}
.search-row{display:flex;gap:8px}
.search-row input{flex:1;min-width:0;font:inherit;font-size:18px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;outline:none;background:#fff;color:var(--ink)}
.search-row input:focus{border-color:var(--brand-2)}
.search-row button{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:0 18px;font-weight:700;font-size:16px}
.suggest{list-style:none;margin:8px 0 0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
.suggest li button{display:flex;justify-content:space-between;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid var(--line);padding:11px 14px;color:var(--ink)}
.suggest li:last-child button{border-bottom:0}
.suggest li button:hover,.suggest li button:focus{background:#f1f5ff;outline:none}
.suggest small{color:var(--sub)}
.hint{font-size:13px;color:var(--sub);margin-top:8px}
/* emergency call bar */
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.sos{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(16,24,40,.08);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.sos-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.sos-txt{flex:1;min-width:0;line-height:1.3}
.sos-txt small{display:block;font-size:12px;color:#b91c1c;font-weight:700}
.sos-txt b{font-size:16px}
.sos-txt span{font-size:14px;color:var(--sub);margin-left:6px;font-variant-numeric:tabular-nums}
.sos a{flex:none;display:inline-flex;align-items:center;gap:6px;background:#dc2626;color:#fff;text-decoration:none;font-weight:800;font-size:16px;border-radius:12px;padding:12px 18px}
.sos a:active{background:#b91c1c}

/* tabs */
.tabs{display:flex;gap:6px;margin:18px 0 12px}
.tabs button{flex:1;background:#e7ebf5;border:0;border-radius:10px;padding:10px;font-weight:700;color:var(--sub)}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}

/* group browse */
.group{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.group summary{list-style:none;padding:14px 16px;font-weight:700;display:flex;justify-content:space-between;cursor:pointer}
.group summary::-webkit-details-marker{display:none}
.group summary .cnt{color:var(--sub);font-weight:500;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 14px}
.chip{background:#f1f4fa;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:15px;color:var(--ink)}
.chip:hover{background:#e6ecff;border-color:#c7d3ff}
.chip.small{font-size:13px;padding:4px 10px}

/* person */
.person{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 16px;margin:18px 0 12px}
.person .name{font-size:26px;font-weight:800;line-height:1.2}
.person .name small{font-size:15px;font-weight:600;color:var(--sub);margin-left:6px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.badge{font-size:13px;padding:4px 10px;border-radius:999px;background:#eef2ff;color:var(--brand);font-weight:600}
.badge.arrive{background:var(--accent-soft);color:#c2410c}
.badge.award{background:#fdf3d7;color:#8a5a00}
.summary{margin-top:12px;background:#f7f9fc;border-left:4px solid var(--brand-2);padding:10px 12px;border-radius:8px;font-size:15px}
.summary b{display:block;font-size:12px;color:var(--sub);margin-bottom:2px;font-weight:600}
.note{margin-top:10px;background:var(--warn-soft);color:#7c2d12;padding:10px 12px;border-radius:8px;font-size:14px}
.actions{display:flex;gap:8px;margin-top:12px}
.actions button{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;color:var(--ink)}

.now-banner{background:var(--ok-soft);border:1px solid #bbe5c8;color:#14532d;border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:15px}
.now-banner b{color:var(--ok)}

.day-h{display:flex;align-items:baseline;gap:8px;margin:22px 0 10px}
.day-h h2{font-size:19px;margin:0}
.day-h span{color:var(--sub);font-size:14px}

/* timeline */
.tl{position:relative;padding-left:0;margin:0;list-style:none}
.item{display:grid;grid-template-columns:64px 1fr;gap:10px;margin-bottom:10px}
.time{text-align:right;padding-top:14px;font-variant-numeric:tabular-nums}
.time .s{font-weight:800;font-size:16px}
.time .e{font-size:13px;color:var(--sub)}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:13px 14px;border-left:5px solid var(--c,#94a3b8);min-width:0}
.card.active{outline:3px solid var(--ok);outline-offset:0}
.card.past{opacity:.55}
.card .ph{font-size:12px;font-weight:700;color:var(--c)}
.card h3{font-size:17px;margin:2px 0 4px;line-height:1.35}
.card .place{font-size:13px;color:var(--sub)}
.card .lead{display:inline-block;font-size:11px;font-weight:800;background:var(--accent);color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.card .live{display:inline-block;font-size:11px;font-weight:800;background:var(--ok);color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.myrole{margin-top:8px;background:var(--accent-soft);border-radius:8px;padding:8px 10px;font-size:15px;font-weight:600;color:#9a3412}
.myrole b{font-weight:800}
.card ul{margin:8px 0 0;padding-left:18px;font-size:14.5px}
.card ul li{margin:2px 0}
.card details{margin-top:8px;font-size:14px}
.card details summary{cursor:pointer;color:var(--brand);font-weight:600}
.with{margin-top:8px;font-size:13px;color:var(--sub)}
.with .chips{padding:6px 0 0}

/* program */
.prog{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:6px 0;margin-top:8px}
.prog .row{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.prog .row:last-child{border-bottom:0}
.prog .row .t{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.prog .row .d{font-size:13px;color:var(--sub)}
.prog .row.active{background:var(--ok-soft)}
h2.sec{font-size:18px;margin:22px 0 8px}

/* parking map */
.map-box{margin-top:10px}
.pickup{margin-top:10px;border:2px solid #dc2626;border-radius:10px;overflow:hidden}
.pickup ol{margin:0;padding:0;list-style:none}
.pickup li{display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:15px;font-weight:700;color:#7f1d1d;background:#fff5f5}
.pickup li+li{border-top:1px dashed #fca5a5}
.pickup .no{flex:none;width:26px;height:26px;border-radius:50%;background:#dc2626;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.pickup .hl{background:#fde047;color:#111;padding:0 4px;border-radius:4px}
.map-where{background:#fee2e2;color:#991b1b;border-radius:8px;padding:8px 10px;font-size:15px;font-weight:700;margin-bottom:8px}
.map-where small{display:block;font-weight:500;color:#7f1d1d;font-size:12px}
.map{position:relative;border-radius:10px;overflow:hidden;background:#ddd;line-height:0}
.map img{width:100%;height:auto;display:block}
.map .dim{position:absolute;inset:0;pointer-events:none;transition:opacity .2s;
  background:radial-gradient(ellipse 13% 17% at var(--x) var(--y), rgba(0,0,0,0) 0%, rgba(0,0,0,0) 55%, rgba(0,0,0,.62) 100%)}
.map.all .dim{opacity:0}
.map .ring{position:absolute;left:var(--x);top:var(--y);width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:4px solid #ef4444;box-shadow:0 0 0 3px #fff;pointer-events:none;animation:pulse 1.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.7);opacity:1}70%{transform:scale(1.5);opacity:.25}100%{transform:scale(.7);opacity:1}}
.map .tag{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-150%);background:#ef4444;color:#fff;font-size:13px;font-weight:800;line-height:1.2;padding:5px 9px;border-radius:8px;white-space:nowrap;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.map .tag::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#ef4444}
.map .tag.left{transform:translate(-12%,-150%)}
.map .tag.left::after{left:12%}
.map .tag.right{transform:translate(-88%,-150%)}
.map .tag.right::after{left:88%}
.map .tag.below{transform:translate(-50%,58%)}
.map .tag.below.left{transform:translate(-12%,58%)}
.map .tag.below.right{transform:translate(-88%,58%)}
.map .tag.below::after{bottom:auto;top:-6px;border-top:0;border-bottom:6px solid #ef4444}
.map-tools{display:flex;gap:6px;margin-top:6px}
.map-tools button,.map-tools a{flex:1;text-align:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:13px;color:var(--ink);text-decoration:none}
.btn-loc{background:#ef4444!important;color:#fff!important;border:0!important;font-weight:700}
.empty{text-align:center;color:var(--sub);padding:30px 10px}
footer{font-size:12px;color:var(--sub);text-align:center;margin-top:30px;line-height:1.7}

@media (min-width:640px){
  h1{font-size:28px}
  .item{grid-template-columns:78px 1fr;gap:14px}
}
@media print{
  header.top,.search-card,.tabs,.actions,footer,.sos{display:none}
  body{padding-bottom:0}
  body{background:#fff}
  .card{box-shadow:none;border:1px solid #ccc;border-left-width:5px;break-inside:avoid}
  .card.past{opacity:1}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="eyebrow" id="evTitle"></div>
    <h1 id="evSub"></h1>
    <div class="meta"><span id="evDate"></span><span id="evPlace"></span></div>
  </div>
</header>

<main class="wrap">
  <section class="search-card" role="search">
    <label for="q">이름을 입력하세요</label>
    <div class="search-row">
      <input id="q" type="search" placeholder="예) 김상덕" autocomplete="off" enterkeyhint="search" aria-controls="suggest">
      <button id="go" type="button">조회</button>
    </div>
    <ul class="suggest" id="suggest" role="listbox"></ul>
    <div class="hint">이름 일부만 입력하여도 검색됩니다. 아래 명단에서 직접 선택할 수도 있습니다.</div>
  </section>

  <div class="tabs" role="tablist">
    <button role="tab" id="tabMe" aria-selected="true">개인별 업무</button>
    <button role="tab" id="tabAll" aria-selected="false">전체 행사 일정</button>
  </div>

  <div id="view"></div>

  <footer>
    <div id="evBase"></div>
    <div>일정 변경 사항은 현장 총괄(사무처)의 안내를 우선합니다.</div>
  </footer>
</main>

<div class="sos" id="sos" hidden></div>

<script src="data.js"></script>
<script>
(function(){
  "use strict";
  const PHASE = {
    prep:{label:"사전 준비",c:"var(--prep)"}, cere:{label:"1부 기념식",c:"var(--cere)"},
    game:{label:"2부 지회대항전·부스",c:"var(--game)"}, lunch:{label:"점심게임",c:"var(--lunch)"},
    fin:{label:"3부 화합의 장",c:"var(--fin)"}, post:{label:"행사 후",c:"var(--post)"},
    award:{label:"유공자 수상",c:"var(--award)"}
  };
  const GROUP_ORDER = ["사무처","협의회","심판","개인(스탭)","대체인력","촬영","자원봉사자"];
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  const toMin = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
  const byName = Object.fromEntries(PEOPLE.map(p => [p.name, p]));

  // header
  $("#evTitle").textContent = EVENT.title;
  $("#evSub").textContent = EVENT.subtitle;
  $("#evDate").textContent = "📅 " + EVENT.dateLabel;
  $("#evPlace").textContent = "📍 " + EVENT.place;
  $("#evBase").textContent = "자료 기준: " + EVENT.baseDate + " · 비상연락처 외 개인 연락처는 수록하지 않았습니다.";

  // 이전 버전에서 저장된 조회 기록 삭제 (조회 기록은 저장하지 않음)
  try { localStorage.removeItem("lastName"); } catch(e){}
  let currentName = "";

  // 비상연락처 (data.js의 EVENT.emergency)
  const em = EVENT.emergency;
  if(em && em.tel){
    const sos = $("#sos");
    sos.innerHTML = `<div class="sos-in">
      <div class="sos-txt"><small>🚨 ${esc(em.label || "비상연락처")}</small><b>${esc(em.name)}</b>${em.role ? `<span>${esc(em.role)}</span>` : ""}<span>${esc(em.tel)}</span></div>
      <a href="tel:${esc(em.tel.replace(/[^0-9+]/g,""))}" aria-label="${esc(em.name)} 전화 걸기">📞 전화</a></div>`;
    sos.hidden = false;
  }

  // current time in KST
  function nowKST(){
    const d = new Date(Date.now() + 9*3600*1000);
    return { date: d.toISOString().slice(0,10), min: d.getUTCHours()*60 + d.getUTCMinutes() };
  }

  function tasksOf(name){
    return TASKS.filter(t => t.who.includes(name))
      .sort((a,b) => a.day.localeCompare(b.day) || toMin(a.s)-toMin(b.s) || toMin(a.e)-toMin(b.e));
  }

  /* ---------- search ---------- */
  const q = $("#q"), sug = $("#suggest");
  function matches(v){
    v = v.replace(/\s/g,"");
    if(!v) return [];
    return PEOPLE.filter(p => p.name.includes(v) || p.group.includes(v));
  }
  function showSuggest(){
    const list = matches(q.value).slice(0,8);
    if(!list.length || (list.length===1 && list[0].name===q.value.trim())){ sug.style.display="none"; sug.innerHTML=""; return; }
    sug.innerHTML = list.map(p => `<li><button type="button" data-name="${esc(p.name)}"><span>${esc(p.name)}</span><small>${esc(p.group)} · ${esc(p.pos)}</small></button></li>`).join("");
    sug.style.display = "block";
  }
  function submit(){
    const v = q.value.replace(/\s/g,"");
    if(!v) return;
    if(byName[v]) return go(v);
    const m = matches(v);
    if(m.length===1) return go(m[0].name);
    if(m.length===0){
      sug.style.display="none";
      $("#view").innerHTML = `<div class="empty">‘${esc(v)}’ 이름을 명단에서 찾을 수 없습니다.<br>성함을 다시 확인하여 주시거나 아래 [전체 행사 일정] 및 명단을 이용하여 주십시오.</div>` + groupsHTML();
      return;
    }
    showSuggest();
  }
  q.addEventListener("input", showSuggest);
  q.addEventListener("keydown", e => { if(e.key==="Enter"){ e.preventDefault(); submit(); } });
  $("#go").addEventListener("click", submit);
  sug.addEventListener("click", e => { const b = e.target.closest("button[data-name]"); if(b) go(b.dataset.name); });

  document.addEventListener("click", e => {
    const b = e.target.closest("[data-go]");
    if(b){ e.preventDefault(); go(b.dataset.go); }
  });

  /* ---------- routing ---------- */
  function go(name){
    location.hash = "p=" + encodeURIComponent(name);
  }
  function route(){
    const h = decodeURIComponent(location.hash.slice(1));
    sug.style.display = "none";
    if(h === "all"){ setTab("all"); renderProgram(); return; }
    setTab("me");
    if(h.startsWith("p=") && byName[h.slice(2)]){
      const name = h.slice(2);
      q.value = name;
      currentName = name;
      renderPerson(name);
      window.scrollTo({top: Math.max(0, $(".tabs").offsetTop - 8), behavior:"smooth"});
    } else {
      renderHome();
    }
  }
  window.addEventListener("hashchange", route);

  function setTab(t){
    $("#tabMe").setAttribute("aria-selected", t==="me");
    $("#tabAll").setAttribute("aria-selected", t==="all");
  }
  $("#tabMe").addEventListener("click", () => {
    location.hash = currentName ? "p="+encodeURIComponent(currentName) : "";
    if(!location.hash) route();
  });
  $("#tabAll").addEventListener("click", () => { location.hash = "all"; });

  /* ---------- views ---------- */
  function groupsHTML(){
    return GROUP_ORDER.map(g => {
      const ps = PEOPLE.filter(p => p.group === g);
      if(!ps.length) return "";
      return `<details class="group"><summary>${esc(g)} <span class="cnt">${ps.length}명 ▾</span></summary>
        <div class="chips">${ps.map(p => `<button class="chip" type="button" data-go="${esc(p.name)}">${esc(p.name)}</button>`).join("")}</div></details>`;
    }).join("");
  }

  function renderHome(){
    $("#view").innerHTML = `<h2 class="sec">명단에서 선택</h2>${groupsHTML()}`;
  }

  function renderPerson(name){
    const p = byName[name];
    const list = tasksOf(name);
    const now = nowKST();
    let activeIds = [], nextTask = null;

    list.forEach(t => {
      const dDate = EVENT.days[t.day].date;
      if(dDate === now.date){
        if(now.min >= toMin(t.s) && now.min < toMin(t.e)) activeIds.push(t.id);
        else if(toMin(t.s) > now.min && (!nextTask || toMin(t.s) < toMin(nextTask.s))) nextTask = t;
      }
    });

    let html = `<section class="person">
      <div class="name">${esc(p.name)}<small>${esc(p.group)}</small></div>
      <div class="badges">
        <span class="badge">${esc(p.pos)}</span>
        <span class="badge arrive">당일 도착 ${esc(p.arrive)}</span>
        ${p.award ? `<span class="badge award">🏅 ${esc(p.award)} 수상</span>` : ""}
        <span class="badge">배정 업무 ${list.length}건</span>
      </div>
      ${p.summary ? `<div class="summary"><b>업무 요약 (매뉴얼 별첨1)</b>${esc(p.summary)}</div>` : ""}
      ${p.note ? `<div class="note">⚠ ${esc(p.note)}</div>` : ""}
      <div class="actions">
        ${SPOT_OF(name) ? `<button type="button" class="btn-loc" id="toLoc">📍 내 근무 위치</button>` : ""}
        <button type="button" id="share">🔗 내 일정 링크 복사</button>
        <button type="button" onclick="window.print()">🖨 인쇄</button>
      </div>
    </section>`;

    if(activeIds.length || nextTask){
      const act = list.filter(t => activeIds.includes(t.id));
      html += `<div class="now-banner">${act.length ? `<b>지금 할 일</b> · ${act.map(t => esc(t.title)).join(", ")}<br>` : ""}${nextTask ? `<b>다음 업무</b> · ${esc(nextTask.s)} ${esc(nextTask.title)}` : ""}</div>`;
    }

    ["D0","D1"].forEach(day => {
      const items = list.filter(t => t.day === day);
      if(!items.length) return;
      const D = EVENT.days[day];
      const isToday = D.date === now.date;
      html += `<div class="day-h"><h2>${esc(D.label)}</h2><span>${esc(D.short)}</span></div><ol class="tl">`;
      items.forEach(t => {
        const ph = PHASE[t.phase] || PHASE.prep;
        const role = t.roles && t.roles[name];
        const isLead = t.lead && t.lead.includes(name);
        const active = activeIds.includes(t.id);
        const past = isToday && now.min >= toMin(t.e);
        const others = t.who.filter(n => n !== name);
        const leads = (t.lead || []).filter(n => n !== name);
        html += `<li class="item" id="t-${esc(t.id)}">
          <div class="time"><div class="s">${esc(t.s)}</div><div class="e">~${esc(t.e)}</div></div>
          <article class="card${active ? " active" : ""}${past ? " past" : ""}" style="--c:${ph.c}">
            <div class="ph">${esc(ph.label)}</div>
            <h3>${esc(t.title)}${isLead ? '<span class="lead">총괄</span>' : ""}${active ? '<span class="live">진행 중</span>' : ""}</h3>
            ${t.place && t.place !== "-" ? `<div class="place">📍 ${esc(t.place)}</div>` : ""}
            ${role ? `<div class="myrole">나의 역할 · <b>${esc(role)}</b></div>` : ""}
            ${t.pickup ? pickupHTML(t.pickup, name) : ""}
            ${t.map ? mapHTML(t.map, name) : ""}
            ${t.desc && t.desc.length ? `<ul>${t.desc.map(d => `<li>${esc(d)}</li>`).join("")}</ul>` : ""}
            ${t.prep && t.prep.length ? `<details><summary>준비물 ${t.prep.length}건</summary><ul>${t.prep.map(d => `<li>${esc(d)}</li>`).join("")}</ul></details>` : ""}
            ${others.length ? withHTML(others, leads) : ""}
          </article></li>`;
      });
      html += `</ol>`;
    });

    if(!list.length) html += `<div class="empty">배정된 세부 업무가 없습니다. 현장 총괄에게 확인하여 주십시오.</div>`;

    $("#view").innerHTML = html;
    const tl = $("#toLoc");
    if(tl) tl.addEventListener("click", () => {
      const el = document.querySelector(".map-box[id^='loc-']");
      if(el) el.scrollIntoView({behavior:"smooth", block:"center"});
    });
    const sh = $("#share");
    if(sh) sh.addEventListener("click", () => {
      const url = location.href;
      const done = () => { sh.textContent = "✅ 복사되었습니다"; setTimeout(() => sh.textContent = "🔗 내 일정 링크 복사", 1800); };
      if(navigator.clipboard) navigator.clipboard.writeText(url).then(done, () => prompt("아래 주소를 복사하십시오", url));
      else prompt("아래 주소를 복사하십시오", url);
    });
    if(activeIds.length){
      const el = document.getElementById("t-" + activeIds[0]);
      if(el) setTimeout(() => el.scrollIntoView({behavior:"smooth", block:"center"}), 350);
    }
  }

  // 받침 유무에 따라 을/를 선택
  function josa(w){ const c = w.charCodeAt(w.length-1); return (c >= 0xAC00 && c <= 0xD7A3 && (c-0xAC00)%28) ? "을" : "를"; }

  function pickupHTML(pk, name){
    if(pk.from === name){
      return `<div class="pickup"><ol><li><span class="no">!</span><span>주차안내 요원에게 <span class="hl">${esc(pk.item)}</span> 배부</span></li></ol></div>`;
    }
    return `<div class="pickup"><ol>
      <li><span class="no">1</span><span><span class="hl">${esc(pk.from)}</span>에게 <span class="hl">${esc(pk.item)}</span>${josa(pk.item)} 받아</span></li>
      <li><span class="no">2</span><span>아래 지도의 내 위치로 이동</span></li></ol></div>`;
  }

  function SPOT_OF(name){ return (typeof SPOTS !== "undefined" && SPOTS[name]) || null; }

  function mapHTML(mapKey, name){
    const M = (typeof MAPS !== "undefined") && MAPS[mapKey];
    if(!M) return "";
    const sp = SPOT_OF(name);
    const mine = sp && sp.map === mapKey;
    if(!mine){
      return `<div class="map-box"><div class="map-where">지도에 개인 위치가 지정되어 있지 않습니다<small>근무 위치는 비상연락처(현장 담당자)에게 확인하여 주십시오.</small></div>
        <div class="map all"><img src="${esc(M.src)}" alt="${esc(M.title)} 배치도" loading="lazy"></div>
        <div class="map-tools"><a href="${esc(M.src)}" target="_blank" rel="noopener">🔍 크게 보기</a></div></div>`;
    }
    const same = Object.keys(SPOTS).filter(n => n !== name && SPOTS[n].map === mapKey && SPOTS[n].x === sp.x && SPOTS[n].y === sp.y);
    return `<div class="map-box" id="loc-${esc(mapKey)}">
      <div class="map-where">📍 내 위치: ${esc(sp.where)}<small>${esc(M.title)} · 빨간 원 위치로 이동하여 주십시오${same.length ? " (함께: " + same.map(esc).join(", ") + ")" : ""}</small></div>
      <div class="map" style="--x:${sp.x}%;--y:${sp.y}%">
        <img src="${esc(M.src)}" alt="${esc(M.title)} 배치도" loading="lazy">
        <div class="dim"></div><div class="ring"></div>
        <div class="tag${sp.x < 12 ? " left" : ""}${sp.x > 85 ? " right" : ""}${sp.y < 22 ? " below" : ""}">${esc(name)} 여기!</div>
      </div>
      <div class="map-tools">
        <button type="button" data-toggle-map>👥 전체 인원 위치 보기</button>
        <a href="${esc(M.src)}" target="_blank" rel="noopener">🔍 크게 보기</a>
      </div></div>`;
  }

  document.addEventListener("click", e => {
    const b = e.target.closest("[data-toggle-map]");
    if(!b) return;
    const m = b.closest(".map-box").querySelector(".map");
    const on = m.classList.toggle("all");
    b.textContent = on ? "📍 내 위치만 강조" : "👥 전체 인원 위치 보기";
  });

  function withHTML(others, leads){
    const LIMIT = 10;
    const chip = n => `<button class="chip small" type="button" data-go="${esc(n)}">${esc(n)}${leads.includes(n) ? " (총괄)" : ""}</button>`;
    const sorted = [...leads.filter(n => others.includes(n)), ...others.filter(n => !leads.includes(n))];
    if(sorted.length <= LIMIT) return `<div class="with">함께하는 인원 ${sorted.length}명<div class="chips">${sorted.map(chip).join("")}</div></div>`;
    return `<div class="with"><details><summary>함께하는 인원 ${sorted.length}명 보기</summary><div class="chips">${sorted.map(chip).join("")}</div></details></div>`;
  }

  function renderProgram(){
    const now = nowKST();
    const today = now.date === EVENT.date;
    let html = `<h2 class="sec">행사 당일 진행 순서</h2><div class="prog">`;
    PROGRAM.forEach(r => {
      const act = today && now.min >= toMin(r.s) && now.min < toMin(r.e);
      html += `<div class="row${act ? " active" : ""}"><div class="t">${esc(r.s)}~${esc(r.e)}</div><div><b>${esc(r.title)}</b>${r.desc ? `<div class="d">${esc(r.desc)}</div>` : ""}</div></div>`;
    });
    html += `</div><h2 class="sec">일정 참고사항</h2><div class="prog">`;
    NOTES.forEach(([t,d]) => { html += `<div class="row"><div class="t">${esc(t)}</div><div>${esc(d)}</div></div>`; });
    html += `</div><h2 class="sec">명단에서 선택</h2>${groupsHTML()}`;
    $("#view").innerHTML = html;
  }

  route();
})();
</script>
</body>
</html>
